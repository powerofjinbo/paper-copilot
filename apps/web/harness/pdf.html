<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paper-copilot · PDF harness</title>
    <style>
      .h-app { display: flex; flex-direction: column; height: 100%; }
      .h-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--bg-elev); font: 12.5px var(--font-ui); color: var(--ink-2); }
      .h-bar strong { color: var(--ink); font-weight: 600; margin-right: 8px; }
      .h-bar button { font: 12px var(--font-ui); height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); cursor: pointer; }
      .h-bar button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
      .h-bar .h-spacer { flex: 1; }
      .h-main { flex: 1; display: flex; min-height: 0; }
      .h-log { flex: 1; min-width: 0; padding: 12px 16px; overflow: auto; font: 12.5px/1.6 var(--font-mono); color: var(--ink-2); background: var(--bg-elev); }
      .h-log h2 { font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin: 0 0 6px; }
      .h-log ol { margin: 0; padding-left: 1.5em; }
      .h-pdf { width: var(--pdf-w, 560px); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
      .h-pdf > * { flex: 1 1 auto; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./pdf.tsx"></script>
  </body>
</html>
